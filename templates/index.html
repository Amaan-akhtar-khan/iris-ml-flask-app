<!DOCTYPE html>
<html>
<head>
    <title>Iris AI Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>🌸 Iris Flower AI Predictor</h1>

    <div class="box">
        <form action="{{ url_for('predict') }}" method="POST">
            <input type="number" name="sepal_length" placeholder="Sepal Length"
            step="0.01" min="0" required>

        <input type="number" name="sepal_width" placeholder="Sepal Width"
          step="0.01" min="0" required>

       <input type="number" name="petal_length" placeholder="Petal Length"
          step="0.01" min="0" required>

        <input type="number" name="petal_width" placeholder="Petal Width"
         step="0.01" min="0" required>

            <button type="submit">Predict</button>
        </form>
        
        {% if prediction_text %}
            <div class="result">{{ prediction_text }}</div>
        {% endif %}
        {% if confidence_text %}
            <div class="conf">{{ confidence_text }}</div>
            {% if image_path %}
            <h3>Confidence Chart 📊</h3>
            <img src="{{ image_path }}" width="300">
            {% endif %}
        {% endif %}
    </div>

</body>
</html>
